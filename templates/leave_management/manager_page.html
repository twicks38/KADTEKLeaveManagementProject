{% extends 'base.html' %}
{% load static %}
{% load group_tags %}

{% block title %}
Manager Dashboard
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'additional_css/hr_management.css' %}">
{% endblock %}

{% block content %}

<div class="whitespace-body">

    <div class="hr-page-header">
        <h1>Manager Dashboard</h1>
    </div>


    <section class="dashboard-collapsible">

        <button
            type="button"
            class="dashboard-header"
            id="user-administration-toggle"
            aria-expanded="false"
            aria-controls="manager-dashboard-content"
        >
            <span class="dashboard-header-text">

                <span class="dashboard-header-title">
                    Team Actions
                </span>


            </span>

            <span class="dashboard-arrow" aria-hidden="true">
                ▼
            </span>
        </button>

        <div
            class="dashboard-collapsible-content"
            id="placeholder-content"
            aria-labelledby="placeholder-toggle"
        >

            <div class="dashboard-content-inner">

                <div class="dashboard-grid">

                    <a href="{% url 'leave_management:team_calendar' %}" class="dashboard-option" id="user-teal">
                        <span class="dashboard-option-title">
                            Team Calendar
                        </span>
                    </a>

                    <a href="{% url 'leave_management:request_list' %}" class="dashboard-option" id="user-success">
                        <span class="dashboard-option-title">
                            Approve Leave
                        </span>
                    </a>

                    <a href="#" class="dashboard-option" id="user-warning">
                        <span class="dashboard-option-title">
                            Manage Leave
                        </span>
                    </a>

                    <a href="#" class="dashboard-option" id="user-danger">
                        <span class="dashboard-option-title">
                            Manager Reports
                        </span>

                    </a>

                </div>

            </div>

        </div>

    </section>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    document
        .querySelectorAll(".dashboard-collapsible")
        .forEach(function (collapsible) {

            const toggleButton =
                collapsible.querySelector(".dashboard-header");

            const content =
                collapsible.querySelector(
                    ".dashboard-collapsible-content"
                );

            toggleButton.addEventListener("click", function () {

                const isOpen =
                    toggleButton.getAttribute("aria-expanded") === "true";

                if (isOpen) {
                    closeCollapsible();
                } else {
                    openCollapsible();
                }
            });

            function openCollapsible() {

                toggleButton.setAttribute(
                    "aria-expanded",
                    "true"
                );

                content.style.height =
                    content.scrollHeight + "px";

                content.addEventListener(
                    "transitionend",
                    function handler(event) {

                        if (event.propertyName !== "height") {
                            return;
                        }

                        content.style.height = "auto";

                        content.removeEventListener(
                            "transitionend",
                            handler
                        );
                    }
                );
            }

            function closeCollapsible() {

                content.style.height =
                    content.scrollHeight + "px";

                content.offsetHeight;

                toggleButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

                content.style.height = "0px";
            }
        });
});
</script>
{% endblock %}
